    binding: custom_tools.finnhub_api:finnhub_market_status
    extra_kwargs:
      api_token: ${env.X_FINNHUB_SECRET}

middlewares:
  - import: nexau.archs.main_sub.execution.middleware.context_compaction:ContextCompactionMiddleware
    params:
      threshold: 0.6
