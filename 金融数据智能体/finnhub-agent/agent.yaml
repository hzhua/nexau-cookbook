  - name: finnhub_lobbying
    yaml_path: tools/finnhub_lobbying.tool.yaml
    binding: custom_tools.finnhub_api:finnhub_lobbying
    extra_kwargs:
      api_token: ${env.X_FINNHUB_SECRET}

  # --- Finnhub: Calendar ---
  - name: finnhub_earnings_calendar
    yaml_path: tools/finnhub_earnings_calendar.tool.yaml
    binding: custom_tools.finnhub_api:finnhub_earnings_calendar
