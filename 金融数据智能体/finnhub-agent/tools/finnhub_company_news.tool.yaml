type: tool
name: finnhub_company_news
description: >-
  Get recent news articles for a specific company. Returns up to 10 articles
  with headline, source, summary, and URL.
input_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Stock ticker symbol (e.g. 'AAPL', 'MSFT').
    from_date:
      type: string
      description: Start date YYYY-MM-DD.
    to_date:
      type: string
      description: End date YYYY-MM-DD.
  required:
    - symbol
    - from_date
    - to_date
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
