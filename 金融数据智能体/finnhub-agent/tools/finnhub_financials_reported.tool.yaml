type: tool
name: finnhub_financials_reported
description: >-
  Get financials as reported to the SEC. Returns a summary of the most recent 2
  reports showing available sections (balance sheet, income statement, cash
  flow).
input_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Stock ticker symbol (e.g. 'AAPL', 'MSFT').
    freq:
      type: string
      description: "Frequency: 'annual' or 'quarterly'. Default 'annual'."
  required:
    - symbol
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
