type: tool
name: finnhub_company_profile
description: >-
  Get company profile including name, ticker, country, currency, exchange, IPO
  date, market cap, industry, logo URL, and more.
input_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Stock ticker symbol (e.g. 'AAPL', 'MSFT').
  required:
    - symbol
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
