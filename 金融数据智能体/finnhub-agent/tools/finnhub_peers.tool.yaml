type: tool
name: finnhub_peers
description: >-
  Get a list of peer company ticker symbols for comparison.
input_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Stock ticker symbol (e.g. 'AAPL', 'MSFT').
  required:
    - symbol
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
