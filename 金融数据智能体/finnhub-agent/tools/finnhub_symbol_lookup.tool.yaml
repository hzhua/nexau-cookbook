type: tool
name: finnhub_symbol_lookup
description: >-
  Search for stock/crypto/forex symbols by name, ISIN, or CUSIP. Returns up to
  10 matching symbols.
input_schema:
  type: object
  properties:
    query:
      type: string
      description: Search query — company name, ISIN, or CUSIP.
    exchange:
      type: string
      description: >-
        Optional: Filter results by exchange code (e.g. 'US', 'TO', 'L').
  required:
    - query
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
