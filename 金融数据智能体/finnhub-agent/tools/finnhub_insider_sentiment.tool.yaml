type: tool
name: finnhub_insider_sentiment
description: >-
  Get monthly insider sentiment scores (MSPR — Monthly Share Purchase Ratio) and
  net changes.
input_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Stock ticker symbol (e.g. 'AAPL', 'MSFT').
    from_date:
      type: string
      description: Start date YYYY-MM-DD.
    to_date:
      type: string
      description: End date YYYY-MM-DD.
  required:
    - symbol
    - from_date
    - to_date
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
