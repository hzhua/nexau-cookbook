type: tool
name: finnhub_basic_financials
description: >-
  Get key financial metrics including P/E ratio, P/B ratio, dividend yield,
  52-week high/low, market cap, beta, EPS, ROE, and many more fundamental
  indicators.
input_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Stock ticker symbol (e.g. 'AAPL', 'MSFT').
  required:
    - symbol
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
