type: tool
name: finnhub_earnings_calendar
description: >-
  Get upcoming earnings announcement dates. Can filter by date range and/or
  specific company symbol.
input_schema:
  type: object
  properties:
    from_date:
      type: string
      description: Start date YYYY-MM-DD.
    to_date:
      type: string
      description: End date YYYY-MM-DD.
    symbol:
      type: string
      description: Optional stock ticker symbol to filter results.
  required: []
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
