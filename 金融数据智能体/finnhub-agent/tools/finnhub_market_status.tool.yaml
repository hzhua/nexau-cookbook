type: tool
name: finnhub_market_status
description: >-
  Check whether a stock exchange is currently open or closed. Returns market
  status and session information.
input_schema:
  type: object
  properties:
    exchange:
      type: string
      description: >-
        Exchange code, e.g. 'US' for US market, 'SS' for Shanghai, 'T' for
        Tokyo.
  required:
    - exchange
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
