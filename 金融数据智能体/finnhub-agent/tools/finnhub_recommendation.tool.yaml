type: tool
name: finnhub_recommendation
description: >-
  Get analyst recommendation trends showing monthly counts of strongBuy, buy,
  hold, sell, and strongSell ratings.
input_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Stock ticker symbol (e.g. 'AAPL', 'MSFT').
  required:
    - symbol
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
